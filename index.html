<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigaConnect - ÇOMÜ Biga Kampüs Sosyal Ağı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- BigaBee Vector Logo -->
                <div class="w-10 h-10 bg-brand-500 rounded-full flex items-center justify-center shadow-md text-white font-bold text-xl">
                    🐝
                </div>
                <span class="text-xl font-black bg-gradient-to-r from-brand-600 to-amber-500 bg-clip-text text-transparent">BigaConnect</span>
            </div>
            <div id="navAuthArea" class="flex items-center space-x-3">
                <!-- Dinamik Giriş/Çıkış Alanı -->
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- Sidebar -->
        <div class="md:col-span-1 space-y-2">
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
                <nav class="space-y-1">
                    <button onclick="switchTab('feed')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-brand-600 bg-brand-50 dark:bg-brand-900/20"><i class="fa-solid fa-house"></i><span>Akış</span></button>
                    <button onclick="switchTab('profile')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50"><i class="fa-solid fa-user"></i><span>Profil</span></button>
                </nav>
            </div>
        </div>

        <!-- Feed & Dynamic Area -->
        <div class="md:col-span-3 space-y-6">
            <!-- Feed Tab -->
            <div id="tab-feed" class="space-y-6">
                <!-- Post Creator Box -->
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
                    <textarea id="postInput" placeholder="Biga kampüsünde neler oluyor? İİBF, UBF, MYO..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none h-24"></textarea>
                    <div class="flex justify-between items-center mt-3">
                        <label class="cursor-pointer text-brand-600 hover:text-brand-700 flex items-center space-x-2 font-medium text-sm">
                            <i class="fa-solid fa-image text-lg"></i>
                            <span>Fotoğraf Ekle</span>
                            <input type="file" id="postImageFile" accept="image/*" class="hidden">
                        </label>
                        <button onclick="createPost()" class="bg-brand-500 hover:bg-brand-600 text-white px-6 py-2 rounded-xl font-bold shadow-md transition-all">Paylaş 🐝</button>
                    </div>
                </div>

                <!-- Posts Container -->
                <div id="postsContainer" class="space-y-4">
                    <!-- Paylaşımlar buraya gelecek -->
                </div>
            </div>

            <!-- Profile Tab -->
            <div id="tab-profile" class="hidden space-y-6">
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 text-center space-y-4">
                    <div class="relative w-24 h-24 mx-auto">
                        <img id="profileAvatarPreview" src="https://via.placeholder.com/150" class="w-24 h-24 rounded-full object-cover border-4 border-brand-500 shadow-md">
                        <label class="absolute bottom-0 right-0 bg-brand-500 text-white p-2 rounded-full cursor-pointer hover:bg-brand-600 shadow">
                            <i class="fa-solid fa-camera text-xs"></i>
                            <input type="file" id="profileAvatarInput" accept="image/*" class="hidden" onchange="updateProfileAvatar(this)">
                        </label>
                    </div>
                    <h2 id="profileNameDisplay" class="text-xl font-bold">Öğrenci Adı</h2>
                    <p id="profileDepartmentDisplay" class="text-sm text-gray-500">ÇOMÜ Biga İİBF</p>
                    <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-xl font-bold text-sm shadow hover:bg-red-600">Çıkış Yap</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Auth Modal (Giriş/Kayıt) -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-3xl max-w-md w-full p-8 shadow-2xl border border-gray-100 dark:border-gray-700 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-brand-500 rounded-full flex items-center justify-center mx-auto text-3xl shadow-lg">🐝</div>
                <h2 class="text-2xl font-black">BigaConnect'e Hoş Geldin</h2>
                <p class="text-sm text-gray-500">Sadece ÇOMÜ Biga öğrencilerine özel sosyal ağ</p> fakülte mailinle giriş yap.</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="authEmail" placeholder="Örn: ogrenci@comu.edu.tr" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <input type="password" id="authPassword" placeholder="Şifre" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500">
                <div class="flex space-x-3">
                    <button onclick="handleLogin()" class="w-full bg-brand-500 hover:bg-brand-600 text-white py-3 rounded-xl font-bold shadow-md transition-all">Giriş Yap</button>
                    <button onclick="handleRegister()" class="w-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 py-3 rounded-xl font-bold transition-all">Kayıt Ol</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBxhs8iwlepLjGPbezGKDu8HhFxJICEVIo",
          authDomain: "bigaconnect-56469.firebaseapp.com",
          projectId: "bigaconnect-56469",
          storageBucket: "bigaconnect-56469.firebasestorage.app",
          messagingSenderId: "312522372786",
          appId: "1:312522372786:web:bdddcf9161fc03fd3b7bab",
          measurementId: "G-9KMN1XX61F"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth;
        window.db = db;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.signOut = signOut;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.orderBy = orderBy;
        window.serverTimestamp = serverTimestamp;

        onAuthStateChanged(auth, (user) => {
            const modal = document.getElementById('authModal');
            if (user) {
                modal.classList.add('hidden');
                document.getElementById('profileNameDisplay').innerText = user.email;
                loadPosts();
            } else {
                modal.classList.remove('hidden');
            }
        });
    </script>

    <script>
        function switchTab(tab) {
            document.getElementById('tab-feed').classList.add('hidden');
            document.getElementById('tab-profile').classList.add('hidden');
            if(tab === 'feed') document.getElementById('tab-feed').classList.remove('hidden');
            if(tab === 'profile') document.getElementById('tab-profile').classList.remove('hidden');
        }

        async function handleRegister() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            try {
                await window.createUserWithEmailAndPassword(window.auth, email, pass);
                alert('Kayıt başarılı! Aramıza hoş geldin.');
            } catch (error) {
                alert('Kayıt hatası: ' + error.message);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            try {
                await window.signInWithEmailAndPassword(window.auth, email, pass);
            } catch (error) {
                alert('Giriş başarısız: ' + error.message);
            }
        }

        async function logout() {
            await window.signOut(window.auth);
        }

        async function createPost() {
            const content = document.getElementById('postInput').value;
            const fileInput = document.getElementById('postImageFile');
            let imageUrl = "";

            if(fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.readAsDataURL(fileInput.files[0]);
                reader.onload = async function() {
                    imageUrl = reader.result;
                    await savePostToFirestore(content, imageUrl);
                }
            } else {
                await savePostToFirestore(content, "");
            }
        }

        async function savePostToFirestore(content, imageUrl) {
            if(!content.trim() && !imageUrl) return;
            try {
                await window.addDoc(window.collection(window.db, "posts"), {
                    content: content,
                    imageUrl: imageUrl,
                    author: window.auth.currentUser.email,
                    createdAt: window.serverTimestamp()
                });
                document.getElementById('postInput').value = "";
                document.getElementById('postImageFile').value = "";
                loadPosts();
            } catch(e) {
                alert("Paylaşım hatası: " + e.message);
            }
        }

        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '<p class="text-center text-gray-400">Yükleniyor...</p>';
            try {
                const q = window.query(window.collection(window.db, "posts"), window.orderBy("createdAt", "desc"));
                const querySnapshot = await window.getDocs(q);
                container.innerHTML = "";
                querySnapshot.forEach((doc) => {
                    const post = doc.data();
                    container.innerHTML += `
                        <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700 space-y-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-brand-500 rounded-full flex items-center text-white justify-center font-bold">🐝</div>
                                <div>
                                    <h4 class="font-bold text-sm">${post.author}</h4>
                                    <span class="text-xs text-gray-400">ÇOMÜ Biga Kampüsü</span>
                                </div>
                            </div>
                            <p class="text-gray-700 dark:text-gray-200">${post.content}</p>
                            ${post.imageUrl ? `<img src="${post.imageUrl}" class="rounded-xl max-h-96 w-full object-cover">` : ''}
                        </div>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        }

        function updateProfileAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profileAvatarPreview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>
</html>
