<!DOCTYPE html>
<html lang="tr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigaConnect - ÇOMÜ Biga Sosyal Ağı</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome İkonları -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    if (localStorage.getItem('biga_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brandYellow: '#FACC15',
            brandDarkYellow: '#EAB308',
            brandLightYellow: '#FEF08A'
          }
        }
      }
    }
  </script>
  <style>
    @keyframes beeFly {
      0% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-6deg); }
      50% { transform: translateY(2px) rotate(4deg); }
      75% { transform: translateY(-3px) rotate(-3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes wingFlutter {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.6); }
    }
    .animate-bee { animation: beeFly 2.5s ease-in-out infinite; }
    .bee-wing { transform-origin: bottom center; animation: wingFlutter 0.15s ease-in-out infinite; }
    #mobileDrawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .drawer-closed { transform: translateX(-100%); }
    .drawer-open { transform: translateX(0); }
  </style>
</head>
<body class="bg-yellow-50/30 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen transition-colors duration-200">

  <!-- Gizli Dosya Seçiciler -->
  <input type="file" id="hiddenAvatarInput" accept="image/*" class="hidden" onchange="uploadDirectAvatar(event)">
  <input type="file" id="hiddenBannerInput" accept="image/*" class="hidden" onchange="uploadDirectBanner(event)">
  <input type="file" id="hiddenPostImageInput" accept="image/*" class="hidden" onchange="previewPostImage(event)">

  <!-- MOBİL YAN BAR OVERLAY -->
  <div id="mobileDrawerBackdrop" onclick="closeMobileDrawer()" class="fixed inset-0 bg-black/50 z-40 lg:hidden hidden backdrop-blur-xs"></div>
  
  <aside id="mobileDrawer" class="fixed top-0 left-0 bottom-0 w-72 bg-white dark:bg-gray-800 z-50 p-5 flex flex-col justify-between shadow-2xl lg:hidden drawer-closed border-r border-yellow-200 dark:border-gray-700">
    <div>
      <div class="flex items-center justify-between mb-6 pb-2 border-b border-gray-100 dark:border-gray-700">
        <div class="flex items-center gap-2">
          <span class="text-xl font-black text-gray-900 dark:text-white tracking-tight">Biga<span class="text-yellow-500">Connect</span></span>
        </div>
        <button onclick="closeMobileDrawer()" class="text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <nav class="space-y-2">
        <button onclick="switchTab('timeline'); closeMobileDrawer();" class="menu-btn-mobile w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm bg-yellow-400 text-gray-900 shadow-sm"><span class="flex items-center gap-3"><i class="fa-solid fa-house text-lg"></i><span>Akış</span></span></button>
        <button onclick="switchTab('profile'); closeMobileDrawer();" class="menu-btn-mobile w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm text-gray-700 dark:text-gray-200 hover:bg-yellow-100 dark:hover:bg-gray-700"><span class="flex items-center gap-3"><i class="fa-solid fa-user text-lg text-yellow-600"></i><span>Profilim</span></span></button>
        <button onclick="switchTab('explore'); closeMobileDrawer();" class="menu-btn-mobile w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm text-gray-700 dark:text-gray-200 hover:bg-yellow-100 dark:hover:bg-gray-700"><span class="flex items-center gap-3"><i class="fa-solid fa-compass text-lg text-yellow-600"></i><span>Keşfet & Gündem</span></span></button>
      </nav>
    </div>

    <div class="pt-4 border-t border-yellow-100 dark:border-gray-700 space-y-3">
      <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-xs font-bold bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200"><span class="flex items-center gap-2"><i class="fa-solid fa-moon text-yellow-600"></i><span>Gece / Gündüz Modu</span></span></button>
      <button id="mobileLogoutBtn" onclick="handleLogout(); closeMobileDrawer();" class="w-full py-2.5 bg-red-100 text-red-700 font-extrabold rounded-xl text-xs hidden">Çıkış Yap</button>
    </div>
  </aside>

  <div class="max-w-7xl mx-auto flex flex-col lg:flex-row min-h-screen">

    <!-- DESKTOP SOL MENÜ -->
    <aside class="hidden lg:flex w-64 bg-white dark:bg-gray-800 border-r border-yellow-200 dark:border-gray-700 p-4 flex-col justify-between sticky top-0 h-screen z-30 shadow-sm">
      <div>
        <div class="flex items-center justify-between mb-6 pt-2 px-2">
          <span class="text-2xl font-black text-gray-900 dark:text-white tracking-tight cursor-pointer" onclick="switchTab('timeline')">Biga<span class="text-yellow-500">Connect</span></span>
        </div>

        <nav class="space-y-1.5">
          <button onclick="switchTab('timeline')" id="menuTimeline" class="menu-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm bg-yellow-400 text-gray-900 shadow-sm transition"><span class="flex items-center gap-3"><i class="fa-solid fa-house text-lg"></i><span>Akış</span></span></button>
          <button onclick="switchTab('profile')" id="menuProfile" class="menu-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm text-gray-700 dark:text-gray-200 hover:bg-yellow-100 dark:hover:bg-gray-700 transition"><span class="flex items-center gap-3"><i class="fa-solid fa-user text-lg text-yellow-600"></i><span>Profilim</span></span></button>
          <button onclick="switchTab('explore')" id="menuExplore" class="menu-btn w-full flex items-center justify-between px-4 py-3 rounded-xl font-bold text-sm text-gray-700 dark:text-gray-200 hover:bg-yellow-100 dark:hover:bg-gray-700 transition"><span class="flex items-center gap-3"><i class="fa-solid fa-compass text-lg text-yellow-600"></i><span>Keşfet & Gündem</span></span></button>
        </nav>
      </div>

      <div class="pt-4 border-t border-yellow-100 dark:border-gray-700 space-y-2">
        <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl text-xs font-bold bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-yellow-200 dark:hover:bg-gray-600 transition"><span class="flex items-center gap-2"><i id="themeIcon" class="fa-solid fa-moon text-yellow-600"></i><span id="themeText">Gece Modu</span></span></button>
        <button id="logoutBtn" onclick="handleLogout()" class="w-full py-2 bg-red-100 dark:bg-red-900/30 hover:bg-red-200 text-red-700 dark:text-red-300 font-extrabold rounded-xl text-xs transition hidden"><i class="fa-solid fa-right-from-bracket mr-1"></i> Çıkış Yap</button>
      </div>
    </aside>

    <!-- ORTA İÇERİK ALANI -->
    <main class="flex-1 p-3 sm:p-6 border-r border-yellow-200 dark:border-gray-700">

      <!-- ÜST BAR -->
      <div class="flex justify-between items-center mb-4 sm:mb-6 pb-3 border-b border-yellow-200 dark:border-gray-700">
        <div class="flex items-center gap-2.5">
          <button onclick="openMobileDrawer()" class="lg:hidden p-2 rounded-xl bg-yellow-400 text-gray-900 font-bold active:scale-95 transition shadow-xs"><i class="fa-solid fa-bars text-base"></i></button>
          <h2 id="pageTitle" class="text-lg sm:text-xl font-black text-gray-900 dark:text-white">Akış</h2>
        </div>
        
        <div onclick="handleHeaderProfileClick()" class="flex items-center gap-2.5 bg-white dark:bg-gray-800 border-2 border-yellow-300 dark:border-yellow-500/50 px-2.5 py-1.5 rounded-full cursor-pointer hover:bg-yellow-50 dark:hover:bg-gray-700 transition shadow-sm">
          <div id="userAvatarHeader" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-500 dark:text-gray-300 flex items-center justify-center text-xs border border-gray-300 dark:border-gray-600 overflow-hidden">
            <i id="userAvatarHeaderDefaultIcon" class="fa-solid fa-user"></i>
            <img id="userAvatarHeaderImg" src="" class="w-full h-full object-cover hidden" alt="Avatar">
          </div>
          <div id="userHeaderInfoGroup" class="hidden sm:block text-left">
            <h4 id="userNameHeader" class="font-bold text-xs text-gray-900 dark:text-white leading-tight">Giriş Yapılmadı</h4>
            <span id="userHandleHeader" class="text-[10px] text-gray-400 block">@hesap_yok</span>
          </div>
        </div>
      </div>

      <!-- 1. AKIŞ SEKMESİ -->
      <div id="contentTimeline" class="page-content space-y-4 sm:space-y-5">
        <div class="bg-white dark:bg-gray-800 rounded-2xl p-3 sm:p-4 shadow-sm border-2 border-yellow-200 dark:border-gray-700 relative">
          <textarea id="postText" rows="3" placeholder="Biga kampüsünde ne oluyor? @kullanici_adi ile etiketleyebilirsin..." class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-yellow-400 resize-none text-sm dark:text-white"></textarea>
          
          <div id="postImagePreviewContainer" class="hidden relative mt-2 mb-2 w-full h-40 bg-gray-100 dark:bg-gray-900 rounded-xl overflow-hidden border border-yellow-200 dark:border-gray-700">
            <img id="postImagePreview" src="" class="w-full h-full object-cover" alt="Önizleme">
            <button onclick="removePostImage()" class="absolute top-2 right-2 bg-black/60 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs hover:bg-black transition"><i class="fa-solid fa-xmark"></i></button>
          </div>

          <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-100 dark:border-gray-700">
            <div class="flex gap-4 text-gray-400 text-base">
              <button onclick="triggerPostImageUpload()" type="button" class="hover:text-yellow-600 transition cursor-pointer" title="Fotoğraf Ekle"><i class="fa-regular fa-image"></i></button>
            </div>
            <button onclick="sharePost()" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold px-5 sm:px-6 py-2 rounded-xl text-xs sm:text-sm transition-transform active:scale-95 shadow cursor-pointer">Paylaş 🚀</button>
          </div>
        </div>

        <div id="timeline" class="space-y-4"></div>
      </div>

      <!-- 2. PROFİL SEKMESİ -->
      <div id="contentProfile" class="page-content hidden space-y-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl border-2 border-yellow-200 dark:border-gray-700 shadow-sm overflow-hidden">
          
          <!-- BANNER ALANI -->
          <div id="profileBannerContainer" class="h-36 sm:h-48 bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 relative overflow-hidden group cursor-pointer" onclick="triggerBannerUpload()">
            <img id="profileBannerImg" src="" class="w-full h-full object-cover hidden" alt="Banner">
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold gap-1.5">
              <i class="fa-solid fa-camera"></i> Banner Değiştir
            </div>
          </div>

          <div class="px-5 pb-6 pt-0 relative">
            <div class="flex justify-between items-end -mt-12 sm:-mt-14 mb-3">
              <!-- PP ALANI -->
              <div id="profileAvatarContainer" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-400 dark:text-gray-300 flex items-center justify-center text-4xl border-4 border-white dark:border-gray-800 shadow-lg overflow-hidden relative bg-white group cursor-pointer" onclick="triggerAvatarUpload()">
                <i id="profileAvatarDefaultIcon" class="fa-solid fa-user"></i>
                <img id="profileAvatarImg" src="" class="w-full h-full object-cover hidden" alt="PP">
                <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-[10px] font-bold text-center p-1">
                  <i class="fa-solid fa-camera"></i> PP Değiştir
                </div>
              </div>
              
              <div id="profileActionsContainer" class="flex gap-2">
                <button onclick="openProfileModal()" class="px-4 py-2 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold rounded-xl text-xs sm:text-sm shadow transition cursor-pointer"><i class="fa-solid fa-pen-to-square mr-1"></i> Profili Düzenle</button>
              </div>
            </div>

            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <h3 id="profileNameDisplay" class="text-lg sm:text-xl font-black text-gray-900 dark:text-white">---</h3>
                <span id="profileAccountTypeBadge" class="text-[10px] bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 px-2 py-0.5 rounded-md font-bold">Açık Hesap</span>
              </div>
              <p id="profileHandleDisplay" class="text-xs text-gray-400 font-medium">@---</p>
              
              <div class="flex flex-wrap gap-2 pt-2">
                <span class="bg-yellow-100 dark:bg-gray-700 text-yellow-900 dark:text-yellow-400 text-[11px] font-bold px-2.5 py-1 rounded-lg"><i class="fa-solid fa-graduation-cap mr-1"></i> <span id="profileDeptDisplay">İktisat</span></span>
                <span class="bg-amber-100 dark:bg-gray-700 text-amber-900 dark:text-amber-400 text-[11px] font-bold px-2.5 py-1 rounded-lg"><i class="fa-solid fa-layer-group mr-1"></i> <span id="profileClassDisplay">1. Sınıf</span></span>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-700">
              <p id="profileBioDisplay" class="text-xs sm:text-sm text-gray-700 dark:text-gray-300 leading-relaxed font-medium">Biga kampüsünde vızıldamaya hazır! 🐝</p>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. KEŞFET SEKMESİ -->
      <div id="contentExplore" class="page-content hidden space-y-4">
        <div class="bg-white dark:bg-gray-800 p-4 sm:p-5 rounded-2xl border-2 border-yellow-200 dark:border-gray-700 shadow-sm">
          <h3 class="font-black text-gray-900 dark:text-white text-base mb-3">🔥 Biga Kampüs Kullanıcıları</h3>
          <div id="exploreUserList" class="space-y-2"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- AUTH MODAL (Giriş/Kayıt) -->
  <div id="authModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 max-w-sm w-full border-2 border-yellow-400 shadow-2xl relative">
      
      <div class="text-center mb-4">
        <div class="text-3xl mb-1">🐝</div>
        <h3 class="font-black text-xl text-gray-900 dark:text-white">BigaConnect</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Kampüs Avucunuzun İçinde</p>
      </div>

      <div class="flex bg-gray-100 dark:bg-gray-700 p-1.5 rounded-2xl mb-4">
        <button id="btnTabLogin" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-black rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm transition">GİRİŞ YAP</button>
        <button id="btnTabRegister" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-black rounded-xl text-gray-400 hover:text-gray-600 transition">KAYIT OL</button>
      </div>

      <!-- GİRİŞ FORMU -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kullanıcı Adı veya E-posta</label>
          <input type="text" id="loginUsername" required placeholder="kullanici_adi" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-sm dark:text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Şifre</label>
          <input type="password" id="loginPassword" required placeholder="******" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-sm dark:text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
        </div>
        <button type="submit" class="w-full py-3 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold rounded-xl text-sm shadow transition">Giriş Yap</button>
      </form>

      <!-- KAYIT FORMU -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-2.5 hidden">
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Ad Soyad</label>
          <input type="text" id="regName" required placeholder="Adınız Soyadınız" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kullanıcı Adı</label>
          <input type="text" id="regHandle" required placeholder="kullanici_adi" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Bölümünüz</label>
          <select id="regDept" required class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
            <option value="İktisat">İktisat</option>
            <option value="İşletme">İşletme</option>
            <option value="Uluslararası İlişkiler">Uluslararası İlişkiler</option>
            <option value="Maliye">Maliye</option>
            <option value="YBS">Yönetim Bilişim Sistemleri (YBS)</option>
            <option value="Biga MYO">Biga MYO</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Sınıfınız</label>
          <select id="regClass" required class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
            <option value="1. Sınıf">1. Sınıf</option>
            <option value="2. Sınıf">2. Sınıf</option>
            <option value="3. Sınıf">3. Sınıf</option>
            <option value="4. Sınıf">4. Sınıf</option>
            <option value="Hazırlık">Hazırlık Sınıfı</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Şifre</label>
          <input type="password" id="regPassword" required placeholder="******" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
        </div>
        <button type="submit" class="w-full py-2.5 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold rounded-xl text-xs shadow transition mt-2">Kayıt Ol ve Katıl</button>
      </form>

    </div>
  </div>

  <!-- PROFİL DÜZENLEME MODALI -->
  <div id="profileModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-3xl p-6 max-w-sm w-full border-2 border-yellow-400 shadow-2xl relative">
      <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h3 class="font-black text-lg text-gray-900 dark:text-white mb-4">Profilini Özelleştir</h3>
      
      <form onsubmit="saveProfile(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Ad Soyad</label>
          <input type="text" id="editName" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Kullanıcı Adı</label>
          <input type="text" id="editHandle" class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Bölümünüz</label>
          <select id="editDept" required class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
            <option value="İktisat">İktisat</option>
            <option value="İşletme">İşletme</option>
            <option value="Uluslararası İlişkiler">Uluslararası İlişkiler</option>
            <option value="Maliye">Maliye</option>
            <option value="YBS">Yönetim Bilişim Sistemleri (YBS)</option>
            <option value="Biga MYO">Biga MYO</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Sınıfınız</label>
          <select id="editClass" required class="w-full px-3.5 py-2 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400">
            <option value="1. Sınıf">1. Sınıf</option>
            <option value="2. Sınıf">2. Sınıf</option>
            <option value="3. Sınıf">3. Sınıf</option>
            <option value="4. Sınıf">4. Sınıf</option>
            <option value="Hazırlık">Hazırlık Sınıfı</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">Biyografi</label>
          <textarea id="editBio" rows="2" placeholder="Hakkında kısa bir şeyler yaz..." class="w-full p-3 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:ring-2 focus:ring-yellow-400 resize-none"></textarea>
        </div>
        <button type="submit" class="w-full py-2.5 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold rounded-xl text-xs shadow transition mt-2">Değişiklikleri Kaydet</button>
      </form>
    </div>
  </div>

  <!-- TAM SİLİNMEYEN YEREL VERİTABANI KODLARI -->
  <script>
    // Başlangıç Varsayılan Gönderileri
    const DEFAULT_POSTS = [
      {
        id: "p1",
        name: "Ahmet Yılmaz",
        handle: "@ahmetyilmaz",
        avatarUrl: "",
        text: "Biga İİBF kütüphanesi vize haftasında yine tıklım tıklım! 📚🐝",
        postImageUrl: "",
        replies: [
          { name: "Elif Kaya", handle: "@elifkaya", avatarUrl: "", text: "Aynen valla, sabah 8'de gelmek şart..." }
        ]
      },
      {
        id: "p2",
        name: "Elif Kaya",
        handle: "@elifkaya",
        avatarUrl: "",
        text: "Ramazan Aydın Kampüsü yemekhanesindeki tatlılar bugün harikaydı. 😋",
        postImageUrl: "",
        replies: []
      }
    ];

    let currentUser = JSON.parse(localStorage.getItem('biga_current_user')) || null;
    let posts = JSON.parse(localStorage.getItem('biga_posts')) || DEFAULT_POSTS;
    let currentPostImage = "";

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      renderPosts();
    });

    function checkAuth() {
      const modal = document.getElementById('authModal');
      if (currentUser) {
        modal.classList.add('hidden');
        document.getElementById('userNameHeader').innerText = currentUser.name;
        document.getElementById('userHandleHeader').innerText = '@' + currentUser.handle;
        document.getElementById('logoutBtn').classList.remove('hidden');
        document.getElementById('mobileLogoutBtn').classList.remove('hidden');

        // Profil Sayfasını Doldur
        document.getElementById('profileNameDisplay').innerText = currentUser.name;
        document.getElementById('profileHandleDisplay').innerText = '@' + currentUser.handle;
        document.getElementById('profileDeptDisplay').innerText = currentUser.dept || 'İktisat';
        document.getElementById('profileClassDisplay').innerText = currentUser.classNum || '1. Sınıf';
        document.getElementById('profileBioDisplay').innerText = currentUser.bio || 'Biga kampüsünde vızıldamaya hazır! 🐝';

        if (currentUser.avatarUrl) {
          document.getElementById('userAvatarHeaderImg').src = currentUser.avatarUrl;
          document.getElementById('userAvatarHeaderImg').classList.remove('hidden');
          document.getElementById('userAvatarHeaderDefaultIcon').classList.add('hidden');
          
          document.getElementById('profileAvatarImg').src = currentUser.avatarUrl;
          document.getElementById('profileAvatarImg').classList.remove('hidden');
          document.getElementById('profileAvatarDefaultIcon').classList.add('hidden');
        }

        if (currentUser.bannerUrl) {
          document.getElementById('profileBannerImg').src = currentUser.bannerUrl;
          document.getElementById('profileBannerImg').classList.remove('hidden');
        }
      } else {
        modal.classList.remove('hidden');
      }
    }

    function switchAuthTab(tab) {
      if (tab === 'register') {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('btnTabRegister').className = "flex-1 py-2 text-xs font-black rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm transition";
        document.getElementById('btnTabLogin').className = "flex-1 py-2 text-xs font-black rounded-xl text-gray-400 hover:text-gray-600 transition";
      } else {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('btnTabLogin').className = "flex-1 py-2 text-xs font-black rounded-xl bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm transition";
        document.getElementById('btnTabRegister').className = "flex-1 py-2 text-xs font-black rounded-xl text-gray-400 hover:text-gray-600 transition";
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const handle = document.getElementById('loginUsername').value.replace('@','');
      currentUser = {
        name: handle,
        handle: handle,
        dept: 'İktisat',
        classNum: '1. Sınıf',
        bio: 'Biga kampüsünde vızıldamaya hazır! 🐝',
        avatarUrl: '',
        bannerUrl: ''
      };
      localStorage.setItem('biga_current_user', JSON.stringify(currentUser));
      checkAuth();
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const handle = document.getElementById('regHandle').value.replace('@','');
      const dept = document.getElementById('regDept').value;
      const classNum = document.getElementById('regClass').value;

      currentUser = {
        name,
        handle,
        dept,
        classNum,
        bio: 'Biga kampüsünde vızıldamaya hazır! 🐝',
        avatarUrl: '',
        bannerUrl: ''
      };
      localStorage.setItem('biga_current_user', JSON.stringify(currentUser));
      checkAuth();
    }

    function handleLogout() {
      localStorage.removeItem('biga_current_user');
      currentUser = null;
      location.reload();
    }

    function triggerAvatarUpload() { document.getElementById('hiddenAvatarInput').click(); }
    function uploadDirectAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        currentUser.avatarUrl = event.target.result;
        localStorage.setItem('biga_current_user', JSON.stringify(currentUser));
        checkAuth();
      };
      reader.readAsDataURL(file);
    }

    function triggerBannerUpload() { document.getElementById('hiddenBannerInput').click(); }
    function uploadDirectBanner(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        currentUser.bannerUrl = event.target.result;
        localStorage.setItem('biga_current_user', JSON.stringify(currentUser));
        checkAuth();
      };
      reader.readAsDataURL(file);
    }

    function triggerPostImageUpload() { document.getElementById('hiddenPostImageInput').click(); }
    function previewPostImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        currentPostImage = event.target.result;
        document.getElementById('postImagePreview').src = currentPostImage;
        document.getElementById('postImagePreviewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removePostImage() {
      currentPostImage = "";
      document.getElementById('postImagePreviewContainer').classList.add('hidden');
    }

    function sharePost() {
      const text = document.getElementById('postText').value;
      if (!text.trim() && !currentPostImage) return alert("Boş gönderi paylaşılamaz!");

      const newPost = {
        id: "p_" + Date.now(),
        name: currentUser.name,
        handle: "@" + currentUser.handle,
        avatarUrl: currentUser.avatarUrl || "",
        text: text,
        postImageUrl: currentPostImage,
        replies: []
      };

      posts.unshift(newPost);
      localStorage.setItem('biga_posts', JSON.stringify(posts));
      document.getElementById('postText').value = "";
      removePostImage();
      renderPosts();
    }

    function sendReply(postId) {
      const input = document.getElementById(`replyInput_${postId}`);
      if (!input.value.trim()) return;

      const post = posts.find(p => p.id === postId);
      if (post) {
        post.replies.push({
          name: currentUser.name,
          handle: "@" + currentUser.handle,
          avatarUrl: currentUser.avatarUrl || "",
          text: input.value
        });
        localStorage.setItem('biga_posts', JSON.stringify(posts));
        renderPosts();
      }
    }

    function renderPosts() {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = "";

      posts.forEach(p => {
        const postEl = document.createElement('div');
        postEl.className = "bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-sm border border-yellow-200 dark:border-gray-700 space-y-3";
        
        const avatarHTML = p.avatarUrl ? `<img src="${p.avatarUrl}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-gray-400"></i>`;
        const imageHTML = p.postImageUrl ? `<div class="mt-2 rounded-xl overflow-hidden max-h-80"><img src="${p.postImageUrl}" class="w-full h-full object-cover"></div>` : "";

        let repliesHTML = p.replies.map(r => `
          <div class="flex gap-2 pt-2 border-t border-gray-100 dark:border-gray-700 text-xs">
            <div class="w-6 h-6 rounded-full bg-gray-200 overflow-hidden flex items-center justify-center shrink-0">
              ${r.avatarUrl ? `<img src="${r.avatarUrl}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-[10px] text-gray-400"></i>`}
            </div>
            <div>
              <span class="font-bold text-gray-900 dark:text-white">${r.name}</span> <span class="text-gray-400 text-[10px]">${r.handle}</span>
              <p class="text-gray-700 dark:text-gray-300 mt-0.5">${r.text}</p>
            </div>
          </div>
        `).join('');

        postEl.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 overflow-hidden flex items-center justify-center">
              ${avatarHTML}
            </div>
            <div>
              <h4 class="font-bold text-sm text-gray-900 dark:text-white">${p.name}</h4>
              <span class="text-xs text-gray-400">${p.handle}</span>
            </div>
          </div>
          <p class="text-sm text-gray-800 dark:text-gray-100">${p.text}</p>
          ${imageHTML}
          
          <div class="pt-2 border-t border-gray-100 dark:border-gray-700 space-y-2">
            ${repliesHTML}
            <div class="flex items-center gap-2 pt-1">
              <input type="text" id="replyInput_${p.id}" placeholder="Yanıt yaz..." class="flex-1 px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-700 dark:bg-gray-900 text-xs dark:text-white focus:outline-none">
              <button onclick="sendReply('${p.id}')" class="px-3 py-1.5 bg-yellow-400 text-gray-900 font-bold rounded-xl text-xs">Yanıtla</button>
            </div>
          </div>
        `;
        timeline.appendChild(postEl);
      });
    }

    function openProfileModal() {
      document.getElementById('editName').value = currentUser.name;
      document.getElementById('editHandle').value = currentUser.handle;
      document.getElementById('editDept').value = currentUser.dept || 'İktisat';
      document.getElementById('editClass').value = currentUser.classNum || '1. Sınıf';
      document.getElementById('editBio').value = currentUser.bio || '';
      document.getElementById('profileModal').classList.remove('hidden');
    }

    function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }

    function saveProfile(e) {
      e.preventDefault();
      currentUser.name = document.getElementById('editName').value;
      currentUser.handle = document.getElementById('editHandle').value.replace('@','');
      currentUser.dept = document.getElementById('editDept').value;
      currentUser.classNum = document.getElementById('editClass').value;
      currentUser.bio = document.getElementById('editBio').value;

      localStorage.setItem('biga_current_user', JSON.stringify(currentUser));
      checkAuth();
      closeProfileModal();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('content' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.remove('hidden');
    }

    function openMobileDrawer() {
      document.getElementById('mobileDrawer').classList.remove('drawer-closed');
      document.getElementById('mobileDrawer').classList.add('drawer-open');
      document.getElementById('mobileDrawerBackdrop').classList.remove('hidden');
    }

    function closeMobileDrawer() {
      document.getElementById('mobileDrawer').classList.remove('drawer-open');
      document.getElementById('mobileDrawer').classList.add('drawer-closed');
      document.getElementById('mobileDrawerBackdrop').classList.add('hidden');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('biga_theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('biga_theme', 'dark');
      }
    }
  </script>
</body>
</html>
