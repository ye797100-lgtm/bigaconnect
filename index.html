<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigaConnect - ÇOMÜ Biga Kampüs Sosyal Ağı</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Navbar -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-brand-500 rounded-full flex items-center justify-center shadow-md text-white font-bold text-xl">
                    🐝
                </div>
                <span class="text-xl font-black bg-gradient-to-r from-brand-600 to-amber-500 bg-clip-text text-transparent">BigaConnect</span>
            </div>
            <div id="navAuthArea" class="flex items-center space-x-3">
                <span id="userDisplayUsername" class="text-sm font-bold text-gray-700 dark:text-gray-200"></span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- Sidebar -->
        <div class="md:col-span-1 space-y-2">
            <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
                <nav class="space-y-1">
                    <button onclick="switchTab('feed')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-brand-600 bg-brand-50 dark:bg-brand-900/20"><i class="fa-solid fa-house"></i><span>Akış</span></button>
                    <button onclick="switchTab('profile')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50"><i class="fa-solid fa-user"></i><span>Profil</span></button>
                </nav>
            </div>
        </div>

        <!-- Feed & Dynamic Area -->
        <div class="md:col-span-3 space-y-6">
            <!-- Feed Tab -->
            <div id="tab-feed" class="space-y-6">
                <!-- Post Creator Box -->
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border border-gray-100 dark:border-gray-700">
                    <textarea id="postInput" placeholder="Biga kampüsünde neler oluyor? İİBF, UBF, MYO..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none h-24"></textarea>
                    <div class="flex justify-between items-center mt-3">
                        <label class="cursor-pointer text-brand-600 hover:text-brand-700 flex items-center space-x-2 font-medium text-sm">
                            <i class="fa-solid fa-image text-lg"></i>
                            <span id="selectedFileName">Fotoğraf Ekle</span>
                            <input type="file" id="postImageFile" accept="image/*" class="hidden" onchange="document.getElementById('selectedFileName').innerText = this.files[0] ? this.files[0].name : 'Fotoğraf Ekle'">
                        </label>
                        <button id="btnCreatePost" class="bg-brand-500 hover:bg-brand-600 text-white px-6 py-2 rounded-xl font-bold shadow-md transition-all">Paylaş 🐝</button>
                    </div>
                </div>

                <!-- Posts Container -->
                <div id="postsContainer" class="space-y-4">
                    <p class="text-center text-gray-400">Yükleniyor...</p>
                </div>
            </div>

            <!-- Profile Tab -->
            <div id="tab-profile" class="hidden space-y-6">
                <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 text-center space-y-4">
                    <div class="relative w-24 h-24 mx-auto">
                        <img id="profileAvatarPreview" src="https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png" class="w-24 h-24 rounded-full object-cover border-4 border-brand-500 shadow-md">
                        <label class="absolute bottom-0 right-0 bg-brand-500 text-white p-2 rounded-full cursor-pointer hover:bg-brand-600 shadow">
                            <i class="fa-solid fa-camera text-xs"></i>
                            <input type="file" id="profileAvatarInput" accept="image/*" class="hidden" onchange="updateProfileAvatar(this)">
                        </label>
                    </div>
                    <h2 id="profileNameDisplay" class="text-xl font-bold">Ad Soyad</h2>
                    <p id="profileUsernameDisplay" class="text-sm text-brand-600 font-semibold">@kullaniciadi</p>
                    <p id="profileEmailDisplay" class="text-xs text-gray-400">eposta@adresin.com</p>
                    <button id="btnLogout" class="bg-red-500 text-white px-4 py-2 rounded-xl font-bold text-sm shadow hover:bg-red-600">Çıkış Yap</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Auth Modal (Giriş / Kayıt Sekmeli) -->
    <div id="authModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-3xl max-w-md w-full p-8 shadow-2xl border border-gray-100 dark:border-gray-700 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-brand-500 rounded-full flex items-center justify-center mx-auto text-3xl shadow-lg">🐝</div>
                <h2 class="text-2xl font-black">BigaConnect</h2>
                <p class="text-sm text-gray-500">Kampüsün Sosyal Ağı</p>
            </div>

            <!-- Sekme Seçici (Giriş Yap / Kayıt Ol) -->
            <div class="flex bg-gray-100 dark:bg-gray-700 p-1 rounded-xl">
                <button id="tabLoginBtn" onclick="switchAuthMode('login')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-white dark:bg-gray-800 shadow-sm transition-all">Giriş Yap</button>
                <button id="tabRegisterBtn" onclick="switchAuthMode('register')" class="flex-1 py-2 text-sm font-bold rounded-lg text-gray-500 transition-all">Kayıt Ol</button>
            </div>

            <!-- Google İle Giriş Butonu -->
            <button id="btnGoogleLogin" class="w-full flex items-center justify-center space-x-3 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 py-3 rounded-xl font-semibold shadow-sm hover:bg-gray-50 transition-all">
                <i class="fa-brands fa-google text-red-500"></i>
                <span>Google ile Devam Et</span>
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
                <span class="flex-shrink mx-4 text-xs text-gray-400">VEYA E-POSTA İLE</span>
                <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
            </div>

            <!-- Form Alanları -->
            <div class="space-y-4">
                <!-- Sadece Kayıt Olurken Görünecek Alanlar -->
                <div id="registerExtraFields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-gray-500">Ad Soyad</label>
                        <input type="text"
